name: Lint

on:
  push:
    branches:
      - main
      - feat/*
      - feature/*
      - hotfix/*
      - release/*
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: jdx/mise-action@v5.2.4
        with:
          install: false

      - run: mise install gh-actions-lock
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: mise run actions-lock:verify

      - name: Set Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: "package.json"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: ${{ runner.os }}-nix-store-${{ hashFiles('**/*.nix') }}
          restore-prefixes-first-match: ${{ runner.os }}-nix-store-

      - name: Install treefmt
        run: nix profile install 'nixpkgs#treefmt'

      - name: Install taplo
        run: nix profile install 'nixpkgs#taplo'

      - name: Install prettier
        run: nix profile install 'nixpkgs#prettier'

      - name: Run treefmt
        id: treefmt
        run: |
          treefmt \
            --allow-missing-formatter \
            --fail-on-change \
            --no-cache \
            --formatters prettier \
            --formatters toml

      - name: Create Pull Request
        if: failure() && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          base: ${{ github.ref_name }}
          commit-message: "Format files"
          title: "[bot] Format files with treefmt"
          body: "This is an auto-generated PR to format files."
          labels: bot
          delete-branch: true
